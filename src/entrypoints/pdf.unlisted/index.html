<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiLens PDF 翻译</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">BiLens PDF</span>
      <button id="prev" title="上一页（←）">上一页</button>
      <span id="page-info">- / -</span>
      <button id="next" title="下一页（→）">下一页</button>

      <span class="divider"></span>

      <button id="zoom-out" title="缩小（⌘-）">−</button>
      <span id="zoom-info" class="zoom">140%</span>
      <button id="zoom-in" title="放大（+）">＋</button>
      <button id="zoom-reset" class="small">复位</button>

      <span class="divider"></span>

      <label class="toggle">
        显示
        <select id="mode">
          <option value="bilingual">双语对照</option>
          <option value="translation-only">仅译文</option>
        </select>
      </label>

      <button id="translate-page">翻译本页</button>
      <button id="translate-all" class="primary">全文翻译</button>
      <button id="stop" hidden>中止</button>
      <span id="status" class="status"></span>
    </header>

    <main id="viewer"></main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
